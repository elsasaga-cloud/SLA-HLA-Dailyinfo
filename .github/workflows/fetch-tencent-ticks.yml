name: Fetch Tencent historical ticks

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download tick files
        run: |
          python - <<'PY'
          import csv
          import json
          import time
          import urllib.request
          from pathlib import Path

          output = Path("tick-downloads")
          output.mkdir()
          manifest = []
          for code, name in (("600398", "海澜之家"), ("600690", "海尔智家")):
              source = Path(f"data/eastmoney/{code}_{name}_kline_90d.csv")
              with source.open(encoding="utf-8", newline="") as handle:
                  dates = [row["date"].replace("-", "") for row in csv.DictReader(handle)]
              for date in dates:
                  url = (
                      "http://stock.gtimg.cn/data/index.php?appn=detail"
                      f"&action=download&c=sh{code}&d={date}"
                  )
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Referer": f"https://gu.qq.com/sh{code}/gp",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = response.read()
                          status = response.status
                          content_type = response.headers.get("content-type", "")
                      (output / f"{code}_{date}.bin").write_bytes(body)
                      manifest.append(
                          {
                              "code": code,
                              "date": date,
                              "status": status,
                              "bytes": len(body),
                              "content_type": content_type,
                          }
                      )
                  except Exception as exc:
                      manifest.append({"code": code, "date": date, "error": repr(exc)})
                  time.sleep(0.1)
          (output / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tencent-ticks
          path: tick-downloads
          retention-days: 1
